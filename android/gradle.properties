# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
org.gradle.parallel=true
# Caps concurrent tasks (each native C/C++ compile spawns its own process) -
# this machine has been crashing the Gradle daemon with an out-of-memory
# error during release builds since adding Reanimated/Worklets (2 extra
# native libraries compiling C++ for 2 architectures). Unlimited workers
# defaults to the core count (8 here), which was too much memory pressure
# at once; capping it trades some build speed for not crashing.
org.gradle.workers.max=3
org.gradle.caching=true
org.gradle.daemon=true

# AndroidX and Jetifier
android.useAndroidX=true
android.enableJetifier=true

# Architecture settings
reactNativeArchitectures=armeabi-v7a,arm64-v8a

# New Architecture (Fabric/TurboModules) - set to true only if using new architecture
newArchEnabled=true

# Hermes JS engine
hermesEnabled=true

# Kotlin version
kotlinVersion=2.1.20